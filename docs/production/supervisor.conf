[program:feitoo-worker]
directory=/var/www/feitoo/feitoo-api
command=/usr/bin/php artisan queue:work database --queue=default --sleep=1 --tries=3 --timeout=60 --memory=256 --max-time=3600
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=90
redirect_stderr=true
stdout_logfile=/var/www/feitoo/feitoo-api/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
