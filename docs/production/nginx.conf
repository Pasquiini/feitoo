# Example only. Install certificate first; adapt PHP socket to installed version.
server {
    listen 80;
    server_name api.feitoo.com.br;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://api.feitoo.com.br$request_uri; }
}
server {
    listen 443 ssl;
    server_name api.feitoo.com.br;
    root /var/www/feitoo/feitoo-api/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/api.feitoo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.feitoo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 32m;
    client_body_timeout 60s;
    # Omit query strings: OAuth callbacks carry authorization codes.
    access_log /var/log/nginx/feitoo-access.log feitoo_private;
    error_log /var/log/nginx/feitoo-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ /\. { deny all; }
    location ^~ /storage/ { deny all; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
}
# In nginx.conf's http block, BEFORE including this file:
# log_format feitoo_private '$remote_addr $request_method $uri $status $request_time';
